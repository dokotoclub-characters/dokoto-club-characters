<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOKOTOクラブ キャラクター紹介</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- ヘッダー -->
    <header class="header">
     <div class="logo-area">
  <img
    src="images/header-banner.png"
    alt="たちかわ競輪DOKOTOクラブ キャラクター紹介"
    class="header-banner"
  >
</div>
    </header>


    <!-- タブ -->
    <div class="tabs">

 <button
  class="tab-button active"
  data-target="official"
  aria-label="公式キャラクター">
<img
  src="images/tab_official.png"
  alt="公式キャラクター"
>
</button>

<button
  class="tab-button"
  data-target="girls"
  aria-label="ガールズケイリン予想キャラクター">
<img
  src="images/tab_girls.png"
  alt="ガールズケイリン予想キャラクター"
>
</button>

    </div>


    <!-- ================================
         公式キャラクター
    ================================= -->

    <main id="official" class="character-page active-page">

       <div class="official-title-image">
<img
  src="images/official-character-title.png"
  alt="公式キャラクター"
  style="width:640px !important; max-width:90vw !important; height:auto !important; display:block !important; margin:0 auto !important;"
>
</div>


        <!-- 9キャラクター一覧 -->
        <div class="character-grid" style="grid-template-columns: repeat(3, 1fr) !important;">

            <!-- DOKOぽん -->
            <button
                class="character-card"
                data-scroll="dokopon"
                aria-label="DOKOぽんの紹介">

                <div class="character-placeholder">
                    <img
                        src="images/dokopon.png"
                        alt="DOKOぽん">

<div class="detail-image-placeholder">

============================== -->
